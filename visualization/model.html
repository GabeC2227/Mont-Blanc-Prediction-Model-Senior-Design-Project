<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mont Blanc</title>
    <link rel ="stylesheet" href="./style.css">
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b4f8f; /* Stops that black flash before renderder loads*/
      }

      body,

      .poi-panel,
      .back-button,
      .slider-overlay {
        font-family: "Times New Roman", Times, serif;
      }

      canvas {
        display: block;
      }

      /* This makes the slider float over the canvas */
      .slider-overlay {
        position: absolute;
        bottom: 20px;      /* distance from bottom */
        left: 50%;         /* center horizontally */
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.8);
        padding: 5px;
        border-radius: 8px;
        color: #0a2540;
        /* Make the whole box wider, but shrink on small screens */
        width: min(800px, 90%);
        text-align: center;
      }

      /* Make the slider itself longer - relative to overlay container */
      .slider-overlay input[type="range"] {
        width: 70%;
      }
    </style>
  </head>
  <body>
    <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
    </script>
    <script type="module" src="./main.js"></script>

    <div id="poi-ui-panel" class="poi-panel hidden"></div>

    <!-- Age Slider Implementation -->
    <div class="slider-overlay">
      <label for="AgeSlider:">
        Prediction Year:
        <span id="yearDisplay">2027</span>
      </label>
      <input type="range" id="AgeSlider" min="2027" max="2076" value="2027" step="1">
      <!-- Constant Rotation Check Box -->
      <input type="checkbox" id="Rotate">
      <label for="Rotate">Constant Model Rotation</label>
    </div>

    <!-- <div class="checkbox-row">
        <input type="checkbox" id="Auto">
        <label for="Auto">Auto Progress Slider</label>
    </div> -->
    
    <a class="back-button" href="index.html">← Back</a>
  </body>
</html>
